<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MALANG</title>
<style>
@font-face{font-family:PDH;src:url('./온글잎 박다현체.ttf') format('truetype');font-weight:400}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:PDH,'Ownglyph PDH Regular',sans-serif;color:#75628b}
body{background:#fffaff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(#d9c8ef 1px,transparent 1px);background-size:23px 23px}
.wrap{max-width:1160px;margin:auto;padding:28px 18px 45px}
header{text-align:center;margin-bottom:18px}.logo{font-size:58px;line-height:1;color:#aa8be0;text-shadow:3px 4px 0 #f0ddff}.sub{font-size:17px;color:#a994b7;margin-top:9px}
.card{background:#fff;border:2px solid #eadcff;border-radius:28px;box-shadow:0 12px 32px #b99cdb2e}
.upload{padding:42px 24px;text-align:center;border-style:dashed;cursor:pointer}.upload .cloud{font-size:55px}.upload h2{margin:8px 0;color:#8d74b9;font-size:25px}.upload p{margin:5px;color:#aa98b9;font-size:17px}
.btn{border:0;border-radius:18px;background:#c6a8ef;color:white;padding:12px 22px;font:inherit;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #a68ad4}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a68ad4}.btn.secondary{background:#efe5fa;color:#8d76a8;box-shadow:0 5px 0 #d7c4e9}
#file{display:none}.hint{font-size:13px;color:#b39fc1;margin-top:13px}
.work{display:grid;grid-template-columns:235px 1fr 215px;gap:14px}.panel{padding:18px}.panel h3{font-size:20px;margin:0 0 13px}.row{margin:18px 0}.row label{display:flex;justify-content:space-between;font-size:16px}.range{width:100%;accent-color:#ad91e4}.stage{padding:13px;display:flex;flex-direction:column;align-items:center}.canvasbox{width:100%;aspect-ratio:1/1;max-height:670px;border-radius:24px;overflow:hidden;border:2px solid #eee2fa;background:radial-gradient(circle,#fff,#faf3ff);position:relative}.canvasbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.tip{margin:10px 0 2px;background:#fff;border:2px solid #efdfff;border-radius:999px;padding:8px 17px;font-size:16px}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:8px}.effect{border:2px solid #eee2fa;background:#fff;border-radius:15px;padding:10px 5px;font:inherit;color:#8e7aa3;cursor:pointer;font-size:15px}.effect.active{border-color:#b99bea;background:#f8f1ff}
.info{text-align:center;padding:18px}.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #eadcff;background:#faf5ff}.info h3{font-size:20px;margin:14px 0 7px}.muted{font-size:14px;line-height:1.65;color:#a995b8}.info .btn{width:100%;margin-top:7px}
.badge{display:inline-block;padding:5px 10px;background:#f5edfc;border-radius:999px;font-size:12px;color:#9c83b5;margin-top:5px}
.bottom{text-align:center;margin-top:18px;color:#b09bc2;font-size:14px}
@media(max-width:900px){.work{grid-template-columns:1fr}.panel.left{order:2}.info{display:grid;grid-template-columns:90px 1fr;gap:12px;text-align:left}.info .thumb{grid-row:1/3}.logo{font-size:47px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">MALANG</div><div class="sub">사진을 넣으면 동글동글 말랑이가 돼요! 🫳🏻</div></header>

<section class="card upload" id="drop">
  <div class="cloud">☁︎</div>
  <h2>사진을 여기로 데려와 주세요!</h2>
  <p>사진을 고르면 가운데를 중심으로 동그랗게 잘라져요.</p>
  <button class="btn" id="pick">사진 선택하기</button>
  <div class="hint">PNG · JPG · WEBP　/　사진은 이 브라우저 안에서 처리돼요 ♡</div>
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
</section>

<div class="work" id="work" style="display:none">
<aside class="card panel left">
  <h3>🍮 말랑 설정</h3>
  <div class="row"><label>말랑도 <b id="sqv">60</b></label><input class="range" id="squish" type="range" min="10" max="100" value="60"></div>
  <div class="row"><label>탱력 <b id="spv">75</b></label><input class="range" id="spring" type="range" min="10" max="100" value="75"></div>
  <h3>✨ 만지기</h3>
  <div class="effects">
    <button class="effect active" data-mode="press">🫳<br>꾹</button>
    <button class="effect" data-mode="poke">👉<br>콕</button>
    <button class="effect" data-mode="bounce">💥<br>통통</button>
    <button class="effect" data-mode="shake">〰️<br>흔들</button>
  </div>
  <div class="row"><button class="btn secondary" id="reset">↻ 원래대로</button></div>
</aside>

<main class="card stage">
  <div class="canvasbox" id="box"><canvas id="view"></canvas></div>
  <div class="tip">🫳 꾹 누르면서 끌어보세요 · 마우스로 돌려도 돼요! ✦</div>
</main>

<aside class="card info">
  <img id="thumb" class="thumb">
  <div>
    <h3>💗 나의 말랑이</h3>
    <div class="badge">360° 회전 가능</div>
    <p class="muted">사진은 정중앙을 기준으로<br>동그랗게 잘라 3D 말랑이로 만들어요.</p>
    <button class="btn" id="video">● 말랑이 동영상 저장</button>
    <button class="btn secondary" id="again">♡ 다른 사진</button>
  </div>
</aside>
</div>
<div class="bottom">말랑 · 콕 · 통통 · 탱!　⋆｡°✩</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const input=$('#file'), drop=$('#drop'), work=$('#work'), view=$('#view'), box=$('#box');
const renderer=new THREE.WebGLRenderer({canvas:view,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(700,700,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,.1,100); camera.position.z=4.4;
scene.add(new THREE.AmbientLight(0xffffff,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,3,4);scene.add(key);
const rim=new THREE.DirectionalLight(0xd9c6ff,1.3);rim.position.set(-3,-1,-2);scene.add(rim);
let mesh=null, texture=null, originalScale=new THREE.Vector3(1,1,1);
let down=false,lastX=0,lastY=0,velX=0,velY=0,rotationX=0,rotationY=0;
let squish=60,spring=75,mode='press',touchStart=0;
const particles=[];
const pgeo=new THREE.BufferGeometry(); const positions=[]; for(let i=0;i<180;i++){positions.push(0,0,0)}
pgeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
const pmaterial=new THREE.PointsMaterial({color:0xffffff,size:.055,transparent:true,opacity:.95,depthWrite:false});
const points=new THREE.Points(pgeo,pmaterial);scene.add(points);
const particleVel=Array.from({length:180},()=>new THREE.Vector3());let particleLife=new Float32Array(180);

function fit(){
 const w=box.clientWidth,h=box.clientHeight; renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',fit);

function makeCircleTexture(img){
 const size=1024,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
 x.clearRect(0,0,size,size);x.save();x.beginPath();x.arc(size/2,size/2,size/2,0,Math.PI*2);x.clip();
 const side=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-side)/2, sy=(img.naturalHeight-side)/2;
 x.drawImage(img,sx,sy,side,side,0,0,size,size);x.restore();
 return new THREE.CanvasTexture(c);
}
function loadFile(f){
 if(!f || !/^image\\/(png|jpeg|webp)$/.test(f.type))return;
 const url=URL.createObjectURL(f), im=new Image();
 im.onload=()=>{texture?.dispose();texture=makeCircleTexture(im);texture.colorSpace=THREE.SRGBColorSpace;
   if(mesh)scene.remove(mesh);
   const geo=new THREE.SphereGeometry(1.45,96,64);
   const mat=new THREE.MeshStandardMaterial({map:texture,roughness:.62,metalness:0.02});
   mesh=new THREE.Mesh(geo,mat);scene.add(mesh);mesh.rotation.y=.15;mesh.rotation.x=-.08;
   $('#thumb').src=url;work.style.display='grid';drop.style.display='none';fit();URL.revokeObjectURL(url);
 }; im.src=url;
}
$('#pick').onclick=e=>{e.stopPropagation();input.click()}; drop.onclick=()=>input.click(); input.onchange=e=>loadFile(e.target.files[0]);
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

function pointerPos(e){const r=view.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function burst(x,y){
 for(let i=0;i<9;i++){let idx=particles.findIndex((_,k)=>particleLife[k]<=0);if(idx<0)idx=Math.floor(Math.random()*180);
   const p=positions; const nx=(x/box.clientWidth-.5)*3.0, ny=-(y/box.clientHeight-.5)*3.0;
   p[idx*3]=nx+(Math.random()-.5)*.25;p[idx*3+1]=ny+(Math.random()-.5)*.25;p[idx*3+2]=.25;
   particleVel[idx].set((Math.random()-.5)*.018,(Math.random()-.5)*.018+.012,(Math.random()-.5)*.012);particleLife[idx]=35+Math.random()*35;
 }pgeo.attributes.position.needsUpdate=true;
}
function setPointer(e){const p=pointerPos(e);if(down){const dx=p.x-lastX,dy=p.y-lastY;velX=dx*.012;velY=dy*.012;mesh.rotation.y+=dx*.008;mesh.rotation.x+=dy*.006;burst(p.x,p.y)}lastX=p.x;lastY=p.y}
view.addEventListener('pointerdown',e=>{down=true;view.setPointerCapture(e.pointerId);const p=pointerPos(e);lastX=p.x;lastY=p.y;touchStart=performance.now();burst(p.x,p.y)});
view.addEventListener('pointermove',e=>setPointer(e));
view.addEventListener('pointerup',()=>{down=false});view.addEventListener('pointercancel',()=>{down=false});

function animate(){
 requestAnimationFrame(animate);
 if(mesh){
   velX*=.93;velY*=.93;
   if(!down){mesh.rotation.y+=velX;mesh.rotation.x+=velY}
   const wobble=down?(1+.08*squish/100):1;
   const targetX=down?1-.18*squish/100:1, targetY=down?1+.14*squish/100:1;
   mesh.scale.x += (targetX-mesh.scale.x)*.22;
   mesh.scale.y += (targetY-mesh.scale.y)*.22;
   mesh.scale.z += (wobble-mesh.scale.z)*.18;
   if(!down){mesh.scale.x+=(1-mesh.scale.x)*(.035+spring*.0007);mesh.scale.y+=(1-mesh.scale.y)*(.035+spring*.0007);mesh.scale.z+=(1-mesh.scale.z)*(.035+spring*.0007)}
 }
 for(let i=0;i<180;i++){if(particleLife[i]>0){positions[i*3]+=particleVel[i].x;positions[i*3+1]+=particleVel[i].y;positions[i*3+2]+=particleVel[i].z;particleVel[i].y-=.00045;particleLife[i]--;}}
 pgeo.attributes.position.needsUpdate=true;pmaterial.opacity=.95;
 renderer.render(scene,camera);
}
animate();

$('#squish').oninput=e=>{squish=+e.target.value;$('#sqv').textContent=squish};
$('#spring').oninput=e=>{spring=+e.target.value;$('#spv').textContent=spring};
document.querySelectorAll('.effect').forEach(b=>b.onclick=()=>{document.querySelectorAll('.effect').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
$('#reset').onclick=()=>{if(mesh){mesh.rotation.set(-.08,.15,0);mesh.scale.set(1,1,1)}};
$('#again').onclick=()=>{work.style.display='none';drop.style.display='block';input.value='';window.scrollTo({top:0,behavior:'smooth'})};

let recorder=null,chunks=[];
$('#video').onclick=()=>{
 if(!mesh)return;
 if(!window.MediaRecorder || !view.captureStream){alert('이 브라우저에서는 동영상 저장을 지원하지 않아요. Chrome 최신 버전을 사용해 주세요!');return}
 if(recorder && recorder.state==='recording'){recorder.stop();return}
 chunks=[];const stream=view.captureStream(30);
 let mime='video/webm;codecs=vp9';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';
 recorder=new MediaRecorder(stream,{mimeType:mime});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='malang_play.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);$('#video').textContent='● 말랑이 동영상 저장'};
 recorder.start();$('#video').textContent='■ 녹화 중… 다시 누르면 저장';
};
</script>
</body>
</html>
