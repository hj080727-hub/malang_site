<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MALANG</title>
<style>
@font-face{font-family:PDH;src:url('./온글잎 박다현체.ttf') format('truetype');font-weight:400}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:PDH,'Ownglyph PDH Regular',sans-serif;color:#75628b}
body{background:#fffaff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(#d9c8ef 1px,transparent 1px);background-size:23px 23px}
.wrap{max-width:1160px;margin:auto;padding:28px 18px 45px}
header{text-align:center;margin-bottom:18px}.logo{font-size:58px;line-height:1;color:#aa8be0;text-shadow:3px 4px 0 #f0ddff}.sub{font-size:17px;color:#a994b7;margin-top:9px}
.card{background:#fff;border:2px solid #eadcff;border-radius:28px;box-shadow:0 12px 32px #b99cdb2e}
.upload{padding:42px 24px;text-align:center;border-style:dashed;cursor:pointer}.upload .cloud{font-size:55px}.upload h2{margin:8px 0;color:#8d74b9;font-size:25px}.upload p{margin:5px;color:#aa98b9;font-size:17px}
.btn{border:0;border-radius:18px;background:#c6a8ef;color:white;padding:12px 22px;font:inherit;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #a68ad4}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a68ad4}.btn.secondary{background:#efe5fa;color:#8d76a8;box-shadow:0 5px 0 #d7c4e9}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.hint{font-size:13px;color:#b39fc1;margin-top:13px}
.work{display:grid;grid-template-columns:235px 1fr 215px;gap:14px}.panel{padding:18px}.panel h3{font-size:20px;margin:0 0 13px}.row{margin:18px 0}.row label{display:flex;justify-content:space-between;font-size:16px}.range{width:100%;accent-color:#ad91e4}.stage{padding:13px;display:flex;flex-direction:column;align-items:center}.canvasbox{width:100%;aspect-ratio:1/1;max-height:670px;border-radius:24px;overflow:hidden;border:2px solid #eee2fa;background:radial-gradient(circle,#fff,#faf3ff);position:relative}.canvasbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.tip{margin:10px 0 2px;background:#fff;border:2px solid #efdfff;border-radius:999px;padding:8px 17px;font-size:16px}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:8px}.effect{border:2px solid #eee2fa;background:#fff;border-radius:15px;padding:10px 5px;font:inherit;color:#8e7aa3;cursor:pointer;font-size:15px}.effect.active{border-color:#b99bea;background:#f8f1ff}
.info{text-align:center;padding:18px}.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #eadcff;background:#faf5ff}.info h3{font-size:20px;margin:14px 0 7px}.muted{font-size:14px;line-height:1.65;color:#a995b8}.info .btn{width:100%;margin-top:7px}
.badge{display:inline-block;padding:5px 10px;background:#f5edfc;border-radius:999px;font-size:12px;color:#9c83b5;margin-top:5px}
.bottom{text-align:center;margin-top:18px;color:#b09bc2;font-size:14px}
@media(max-width:900px){.work{grid-template-columns:1fr}.panel.left{order:2}.info{display:grid;grid-template-columns:90px 1fr;gap:12px;text-align:left}.info .thumb{grid-row:1/3}.logo{font-size:47px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">MALANG</div><div class="sub">사진을 고르면 말랑이가 되어요. ♡</div></header>

<section class="card upload" id="drop">
  <div class="cloud">☁︎</div>
  <h2>사진을 여기로 데려와 주세요!</h2>
  <p>사진을 고르면 가운데를 중심으로 동그랗게 잘라져요.</p>
  <label class="btn" id="pick" for="file">사진 선택하기</label>
  <div class="hint">PNG · JPG · WEBP　/　사진은 이 브라우저 안에서 처리돼요 ♡</div>
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
</section>

<div class="work" id="work" style="display:none">
<aside class="card panel left">
  <h3>🍮 말랑 설정</h3>
  <div class="row"><label>말랑도 <b id="sqv">60</b></label><input class="range" id="squish" type="range" min="10" max="100" value="60"></div>
  <div class="row"><label>탱력 <b id="spv">75</b></label><input class="range" id="spring" type="range" min="10" max="100" value="75"></div>
  <h3>✨ 만지기</h3>
<div class="row"><label>⭐ 별 파티클 <b id="pv">ON</b></label><button class="effect active" id="particleToggle" style="width:100%;margin-top:8px;">⭐ 파티클 ON</button></div>
  <div class="row">
    <label>✨ 파티클 수 <b id="pcv">4개</b></label>
    <input class="range" id="particleCount" type="range" min="1" max="8" step="1" value="4">
  </div>
  <div class="row"><label>🔊 효과음 <b id="sv">ON</b></label><button class="effect active" id="soundToggle" style="width:100%;margin-top:8px;">🔊 효과음 ON</button></div>
  <div class="row">
    <label>🔄 회전 감도 <b id="rotv">보통</b></label>
    <input class="range" id="rotationSensitivity" type="range" min="0.3" max="2.5" step="0.1" value="1">
  </div>
  <div class="effects">
    <button class="effect active" data-mode="press">🫳<br>꾹</button>
    <button class="effect" data-mode="poke">👉<br>콕</button>
    <button class="effect" data-mode="bounce">💥<br>통통</button>
    <button class="effect" data-mode="shake">〰️<br>흔들</button>
  </div>
  <div class="row"><button class="btn secondary" id="reset">↻ 원래대로</button></div>
</aside>

<main class="card stage">
  <div class="canvasbox" id="box"><canvas id="view"></canvas></div>
  <div class="tip">🫳 꾹 누르면서 끌어보세요 · 마우스로 돌려도 돼요! ✦</div>
</main>

<aside class="card info">
  <img id="thumb" class="thumb">
  <div>
    <h3>💗 나의 말랑이</h3>
    <div class="badge">360° 회전 가능</div>
    <p class="muted">사진은 정중앙을 기준으로<br>동그랗게 잘라 3D 말랑이로 만들어요.</p>
    <button class="btn" id="video">● 말랑이 동영상 저장</button>
    <button class="btn secondary" id="again">♡ 다른 사진</button>
  </div>
</aside>
</div>
<div class="bottom">말랑 · 콕 · 통통 · 탱!　⋆｡°✩<br><small>간단한 AI 활용을 통해 제작되었습니다. ♥︎<br><span style="font-size:11px;opacity:.75;">Made by 아카시 ♥︎</span></small></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const input=$('#file'), drop=$('#drop'), work=$('#work'), view=$('#view'), box=$('#box');
const renderer=new THREE.WebGLRenderer({canvas:view,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(700,700,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,.1,100); camera.position.z=4.4;
scene.add(new THREE.AmbientLight(0xffffff,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,3,4);scene.add(key);
const rim=new THREE.DirectionalLight(0xd9c6ff,1.3);rim.position.set(-3,-1,-2);scene.add(rim);
let mesh=null, texture=null, originalScale=new THREE.Vector3(1,1,1);
let down=false,lastX=0,lastY=0,velX=0,velY=0,rotationX=0,rotationY=0,lastSound=0;
let squish=60,spring=75,mode='press',touchStart=0,particleEnabled=true;
const particles=[];
const starCanvas=document.createElement('canvas');starCanvas.width=64;starCanvas.height=64;
const starCtx=starCanvas.getContext('2d');
starCtx.clearRect(0,0,64,64);
starCtx.fillStyle='#ffffff';
starCtx.beginPath();
for(let i=0;i<10;i++){
  const a=-Math.PI/2+i*Math.PI/5, r=i%2?11:28;
  const px=32+Math.cos(a)*r, py=32+Math.sin(a)*r;
  if(i===0)starCtx.moveTo(px,py);else starCtx.lineTo(px,py);
}
starCtx.closePath();starCtx.fill();
const starTexture=new THREE.CanvasTexture(starCanvas);
const particleGroup=new THREE.Group();scene.add(particleGroup);

function makeStar(x,y){
  if(!particleEnabled)return;
  const r=view.getBoundingClientRect();
  const nx=(x/r.width-.5)*3.0, ny=-(y/r.height-.5)*3.0;
  const mat=new THREE.SpriteMaterial({map:starTexture,color:0xffffff,transparent:true,opacity:1,depthTest:false,depthWrite:false});
  const star=new THREE.Sprite(mat);
  star.position.set(nx,ny,1.2);
  star.scale.set(.13,.13,1);
  star.userData={
    vx:(Math.random()-.5)*.025,
    vy:(Math.random()-.5)*.025+.018,
    vz:(Math.random()-.5)*.008,
    life:34+Math.random()*24,
    spin:(Math.random()-.5)*.08
  };
  particleGroup.add(star);
}

function burst(x,y){
  if(!particleEnabled)return;
  for(let i=0;i<particleCount;i++)makeStar(x+(Math.random()-.5)*28,y+(Math.random()-.5)*28);
}
function fit(){
 const w=box.clientWidth,h=box.clientHeight; renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',fit);

function makeCircleTexture(img){
  const s = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d', {willReadFrequently:true});

  const scale = Math.min(s / img.width, s / img.height);
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const x = Math.floor((s - w) / 2);
  const y = Math.floor((s - h) / 2);

  // 사진만 투명 캔버스에 배치합니다.
  ctx.clearRect(0, 0, s, s);
  ctx.drawImage(img, x, y, w, h);

  const imageData = ctx.getImageData(0, 0, s, s);
  const data = imageData.data;

  // 핵심 수정:
  // 투명 픽셀을 흰색으로 덮는 대신, 사진의 "가장자리 픽셀"을
  // 반복적으로 바깥으로 복사하여 여백을 채웁니다.
  //
  // 이렇게 하면 사진이
  //   [사진][빈 공간]
  // 형태일 때 빈 공간이 사진 끝 색으로 자연스럽게 연장됩니다.
  const original = new Uint8ClampedArray(data);
  const filled = new Uint8Array(s * s);

  for(let yy=0; yy<s; yy++){
    for(let xx=0; xx<s; xx++){
      const pos = yy*s + xx;
      if(original[pos*4+3] > 0) filled[pos] = 1;
    }
  }

  // 최대 여백만큼 확장합니다.
  const maxDistance = Math.max(
    x,
    y,
    s - (x + w),
    s - (y + h)
  ) + 2;

  for(let distance=1; distance<=maxDistance; distance++){
    let changed = false;
    const next = new Uint8Array(filled);

    for(let yy=0; yy<s; yy++){
      for(let xx=0; xx<s; xx++){
        const pos = yy*s + xx;
        if(filled[pos]) continue;

        // 위/아래/왼쪽/오른쪽의 가장 가까운 이미 채워진 픽셀을 확인합니다.
        const neighbors = [
          [xx-distance, yy],
          [xx+distance, yy],
          [xx, yy-distance],
          [xx, yy+distance]
        ];

        let sourcePos = -1;

        for(const [nx, ny] of neighbors){
          if(nx >= 0 && nx < s && ny >= 0 && ny < s){
            const np = ny*s + nx;
            if(filled[np]){
              sourcePos = np;
              break;
            }
          }
        }

        if(sourcePos >= 0){
          const src = sourcePos * 4;
          const dst = pos * 4;

          data[dst]   = original[src];
          data[dst+1] = original[src+1];
          data[dst+2] = original[src+2];
          data[dst+3] = 255;

          next[pos] = 1;
          changed = true;
        }
      }
    }

    filled.set(next);
    if(!changed) break;
  }

  // 혹시 남은 투명 픽셀이 있다면 마지막 안전장치로 흰색 처리합니다.
  // 정상적인 사진 여백에서는 위 확장 과정에서 대부분 끝 색으로 채워집니다.
  for(let i=0; i<data.length; i+=4){
    if(data[i+3] === 0){
      data[i] = 255;
      data[i+1] = 255;
      data[i+2] = 255;
      data[i+3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function loadFile(f){
 if(!f || !/^image\/(png|jpeg|webp)$/.test(f.type))return;
 const url=URL.createObjectURL(f), im=new Image();
 im.onload=()=>{texture?.dispose();texture=makeCircleTexture(im);texture.colorSpace=THREE.SRGBColorSpace;
   if(mesh)scene.remove(mesh);
   const geo=new THREE.SphereGeometry(1.015,96,64);
   const mat=new THREE.MeshStandardMaterial({map:texture,roughness:.72,metalness:0.01});
   mesh=new THREE.Mesh(geo,mat);scene.add(mesh);mesh.rotation.y=.15;mesh.rotation.x=-.08;
   $('#thumb').src=url;work.style.display='grid';drop.style.display='none';fit();URL.revokeObjectURL(url);
 }; im.src=url;
}
drop.onclick=e=>{if(e.target.closest('#pick'))return;input.click()}; input.onchange=e=>loadFile(e.target.files[0]);
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));


let audioCtx=null,soundEnabled=true,rotationSensitivity=1,particleCount=4;
let squishAudio=null,squishSource=null,soundDestination=null;

function initRecordedAudio(){
  try{
    if(!squishAudio){
      squishAudio=document.createElement('audio');
      squishAudio.src='./squish.mp3';
      squishAudio.preload='auto';
      document.body.appendChild(squishAudio);
    }
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();

    if(!soundDestination)soundDestination=audioCtx.createMediaStreamDestination();
    if(!squishSource){
      squishSource=audioCtx.createMediaElementSource(squishAudio);
      squishSource.connect(audioCtx.destination);
      squishSource.connect(soundDestination);
    }
  }catch(err){console.warn('audio init:',err);}
}

function squishSound(power=1){
  if(!soundEnabled)return;
  initRecordedAudio();
  if(!squishAudio)return;
  squishAudio.volume=Math.max(0,Math.min(1,0.85*power));
  squishAudio.currentTime=0;
  const p=squishAudio.play();
  if(p&&p.catch)p.catch(()=>{});
}
function pointerPos(e){const r=view.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function setPointer(e){const p=pointerPos(e);if(down){const dx=p.x-lastX,dy=p.y-lastY;velX=dx*.012;velY=dy*.012;mesh.rotation.y+=dx*.008*rotationSensitivity;mesh.rotation.x+=dy*.006*rotationSensitivity;burst(p.x,p.y)}lastX=p.x;lastY=p.y}
view.addEventListener('pointerdown',e=>{down=true;view.setPointerCapture(e.pointerId);const p=pointerPos(e);lastX=p.x;lastY=p.y;touchStart=performance.now();burst(p.x,p.y);squishSound(1);});
view.addEventListener('pointermove',e=>setPointer(e));
view.addEventListener('pointerup',()=>{down=false});view.addEventListener('pointercancel',()=>{down=false});

function animate(){
 requestAnimationFrame(animate);
 if(mesh){
   velX*=.93;velY*=.93;
   if(!down){mesh.rotation.y+=velX;mesh.rotation.x+=velY}
   const wobble=down?(1+.08*squish/100):1;
   const targetX=down?1-.24*squish/100:1, targetY=down?1+.19*squish/100:1;
   mesh.scale.x += (targetX-mesh.scale.x)*.22;
   mesh.scale.y += (targetY-mesh.scale.y)*.22;
   mesh.scale.z += (wobble-mesh.scale.z)*.24;
   if(!down){mesh.scale.x+=(1-mesh.scale.x)*(.045+spring*.0009);mesh.scale.y+=(1-mesh.scale.y)*(.045+spring*.0009);mesh.scale.z+=(1-mesh.scale.z)*(.045+spring*.0009)}
 }
  for(let i=particleGroup.children.length-1;i>=0;i--){
    const star=particleGroup.children[i],u=star.userData;
    star.position.x+=u.vx;star.position.y+=u.vy;star.position.z+=u.vz;
    u.vy-=.00065;star.material.rotation+=u.spin;
    u.life--;
    star.material.opacity=Math.max(0,u.life/45);
    star.scale.multiplyScalar(0.985);
    if(u.life<=0){particleGroup.remove(star);star.material.dispose();}
  }
 renderer.render(scene,camera);
}
animate();

$('#squish').oninput=e=>{squish=+e.target.value;$('#sqv').textContent=squish};
$('#spring').oninput=e=>{spring=+e.target.value;$('#spv').textContent=spring};
document.querySelectorAll('.effect[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.effect[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
$('#reset').onclick=()=>{if(mesh){mesh.rotation.set(-.08,.15,0);mesh.scale.set(1,1,1)}};
$('#particleToggle').onclick=()=>{
  particleEnabled=!particleEnabled;
  $('#particleToggle').textContent=particleEnabled?'⭐ 파티클 ON':'☆ 파티클 OFF';
  $('#pv').textContent=particleEnabled?'ON':'OFF';
  $('#particleToggle').classList.toggle('active',particleEnabled);
};
$('#soundToggle').onclick=()=>{
  soundEnabled=!soundEnabled;
  $('#soundToggle').textContent=soundEnabled?'🔊 효과음 ON':'🔇 효과음 OFF';
  $('#sv').textContent=soundEnabled?'ON':'OFF';
  $('#soundToggle').classList.toggle('active',soundEnabled);
};
$('#particleCount').oninput=e=>{
  particleCount=parseInt(e.target.value,10);
  $('#pcv').textContent=particleCount+'개';
};
$('#rotationSensitivity').oninput=e=>{
  rotationSensitivity=parseFloat(e.target.value);
  const label=rotationSensitivity<0.7?'느림':rotationSensitivity<1.3?'보통':rotationSensitivity<1.9?'빠름':'아주 빠름';
  $('#rotv').textContent=label;
};
$('#again').onclick=()=>{work.style.display='none';drop.style.display='block';input.value='';window.scrollTo({top:0,behavior:'smooth'})};

let recorder=null,chunks=[],lastVideoUrl=null,lastVideoBlob=null;
$('#video').onclick=()=>{
  if(!mesh)return;
  if(!window.MediaRecorder||!view.captureStream){
    alert('이 브라우저에서는 동영상 저장을 지원하지 않아요. Chrome 최신 버전을 사용해 주세요!');
    return;
  }
  if(recorder&&recorder.state==='recording'){recorder.stop();return}

  chunks=[];
  initRecordedAudio();

  const canvasStream=view.captureStream(30);
  const tracks=[...canvasStream.getVideoTracks()];
  if(soundDestination){
    const audioTrack=soundDestination.stream.getAudioTracks()[0];
    if(audioTrack)tracks.push(audioTrack);
  }

  const mixedStream=new MediaStream(tracks);
  let mime='video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';

  recorder=new MediaRecorder(mixedStream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    lastVideoBlob=blob;
    if(lastVideoUrl)URL.revokeObjectURL(lastVideoUrl);
    lastVideoUrl=URL.createObjectURL(blob);

    let save=document.getElementById('saveVideo');
    if(!save){
      save=document.createElement('button');
      save.id='saveVideo';
      save.className='btn';
      save.style.width='100%';
      save.style.marginTop='8px';
      $('#video').after(save);
    }
    save.textContent='💾 동영상 저장하기';

    save.onclick=async()=>{
      const file=new File([lastVideoBlob],'malang_play.webm',{type:'video/webm'});

      // Android에서 공유 가능한 경우 공유 메뉴를 열어 갤러리/파일 저장을 바로 선택할 수 있습니다.
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file],title:'말랑이 동영상'});
          return;
        }catch(err){
          if(err&&err.name==='AbortError')return;
        }
      }

      const a=document.createElement('a');
      a.href=lastVideoUrl;
      a.download='malang_play.webm';
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
    save.scrollIntoView({behavior:'smooth',block:'center'});
    $('#video').textContent='● 다시 녹화하기';
  };

  recorder.start();
